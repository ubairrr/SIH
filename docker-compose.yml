# Local Postgres for the offline path (`npm run dev:offline`).
# See .planning/phases/01-login-user-management-tamper-proof-audit-log/01-RESEARCH.md
# Code Examples §2.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: casevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
